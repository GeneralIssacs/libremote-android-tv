name: Build Gamergirls SHIELD APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/gamergirls-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - name: Build installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: libremote-gamergirls-test-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
